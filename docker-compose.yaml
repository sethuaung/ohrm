version: '3.9'

services:
  web:
    build: .
    container_name: orangehrm-web
    volumes:
      - ./config:/etc/orangehrm
      - ./certs:/etc/ssl/certs
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - db

  db:
    image: mariadb:10.4
    container_name: orangehrm-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: orangehrm
      MYSQL_USER: orangehrm
      MYSQL_PASSWORD: hrmpass
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "3306:3306"

volumes:
  db-data:
