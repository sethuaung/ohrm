<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/orangehrm/symfony/web
    ServerName localhost

    <Directory /var/www/html/orangehrm/symfony/web>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    Alias /ohrm /var/www/html/orangehrm/symfony/web

    ErrorLog ${APACHE_LOG_DIR}/orangehrm_error.log
    CustomLog ${APACHE_LOG_DIR}/orangehrm_access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/orangehrm/symfony/web
    ServerName localhost

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/fullchain.pem
    SSLCertificateKeyFile /etc/ssl/certs/privkey.pem

    <Directory /var/www/html/orangehrm/symfony/web>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    Alias /ohrm /var/www/html/orangehrm/symfony/web

    ErrorLog ${APACHE_LOG_DIR}/orangehrm_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/orangehrm_ssl_access.log combined
</VirtualHost>
